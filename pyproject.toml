[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "forgeflow"
dynamic = ["version"]
description = "Windows desktop orchestrator for local image-to-3D, Blender editing, and Unity rigging/animation"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]
build = ["pyinstaller>=6.11,<7"]

[project.scripts]
forgeflow = "forgeflow.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeflow"]

[tool.hatch.version]
path = "src/forgeflow/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
