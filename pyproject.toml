[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "forgeflow"
dynamic = ["version"]
description = "Windows desktop orchestrator for local image-to-3D, Blender editing, and Unity rigging/animation"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]
build = ["pyinstaller>=6.11,<7"]

[project.scripts]
forgeflow = "forgeflow.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeflow"]

[tool.hatch.version]
path = "src/forgeflow/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tmp", "backup", "docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["forgeflow"]
